<meta name="viewport" content="width=device-width,initial-scale=1"><title>My Model 100 keymap</title>
<style>:root{color-scheme:light dark;--foreground:light-dark(#182025,#edf0f2);--background:light-dark(#fff,#161a1e);--muted-foreground:light-dark(#505b62,#bdc7ce);--border:light-dark(#bac2c7,#555f68);--accent:light-dark(#e9eff5,#273744);--primary:light-dark(#223d54,#c9e3f5);--primary-foreground:light-dark(#fff,#14202a);--font-size-base:14px}body{font:14px/1.5 system-ui;background:var(--background);color:var(--foreground);max-width:1050px;margin:24px auto;padding:0 16px}.text-small{font-size:12px}.text-muted{color:var(--muted-foreground)}.form-select{font:inherit;padding:6px;background:var(--background);color:var(--foreground);border:1px solid var(--border)}.btn{font:inherit;padding:6px 12px;background:var(--background);color:var(--foreground);border:1px solid var(--border);border-radius:5px}.viz-controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}button:focus-visible,select:focus-visible{outline:2px solid var(--primary);outline-offset:2px}</style>
</head><body><div id="model100-reference">
  <div class="viz-controls reference-controls">
    <label class="form-label" for="model100-layer">Layer</label>
    <select class="form-select" id="model100-layer">
      <option value="PRIMARY">Base</option><option value="FUNCTION">Navigation</option>
      <option value="MOUSE">Mouse</option><option value="NUMPAD">Numpad</option>
    </select>
  </div>
  <div class="reference-layer" id="model100-current" aria-live="polite"></div>
  <div class="reference-print" id="model100-print"></div>
  <div class="text-small text-muted reference-legend">Position guide · Small top label = factory keycap · Main label = current action · Hold = modifier · Highlight = changed mapping</div>
</div>
<style>
  #model100-reference {color:var(--foreground)}
  #model100-reference .reference-layer {margin:16px 0}
  #model100-reference .reference-hands {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
  #model100-reference .reference-hand {min-width:0}
  #model100-reference .reference-keys {display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  #model100-reference .reference-key {min-width:0;min-height:70px;border:1px solid var(--border);border-radius:5px;padding:4px 2px;text-align:center;display:flex;flex-direction:column;justify-content:space-between;overflow-wrap:anywhere}
  #model100-reference .reference-key.changed {background:var(--accent)}
  #model100-reference .reference-action {font-weight:500}
  #model100-reference .reference-thumb {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:12px 0 4px}
  #model100-reference .reference-palm {width:25%;min-width:80px;margin:10px auto}
  #model100-reference .reference-header {display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
  #model100-reference .reference-print {display:none}
  @media(max-width:680px){#model100-reference .reference-hands{grid-template-columns:minmax(0,1fr)}}
  @media print {
    @page {size:landscape;margin:12mm}
    #model100-reference .reference-controls,#model100-reference #model100-current,#model100-reference .reference-legend {display:none}
    #model100-reference .reference-print {display:block}
    #model100-reference .reference-print-layer {break-after:page;page-break-after:always}
    #model100-reference .reference-print-layer:last-child {break-after:auto;page-break-after:auto}
    #model100-reference .reference-hands {grid-template-columns:repeat(2,minmax(0,1fr))}
    #model100-reference .reference-key {min-height:65px}
  }
</style>
